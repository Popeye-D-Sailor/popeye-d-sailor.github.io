<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to OpenWrt Table of Hardware...</title>
  <meta http-equiv="refresh" content="0; url=https://openwrt.org/toh/start">
  <link rel="canonical" href="https://openwrt.org/toh/start">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0b0f19;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 32px 40px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h2 {
      margin-top: 0;
      color: #f1f5f9;
      font-size: 1.35rem;
    }
    p {
      margin: 16px 0;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
    .spinner {
      margin: 20px auto 10px;
      width: 32px;
      height: 32px;
      border: 3px solid #1e293b;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    window.location.replace("https://openwrt.org/toh/start");
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Redirecting to OpenWrt Table of Hardware</h2>
    <p>Navigating to official portal: <br><a href="https://openwrt.org/toh/start">https://openwrt.org/toh/start</a></p>
    <p style="font-size: 0.8rem; color: #64748b;">If you are not redirected automatically within 3 seconds, please click the link above.</p>
  </div>
</body>
</html>
